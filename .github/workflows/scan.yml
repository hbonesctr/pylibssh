# ============================================================
# DoD Security Scanner — Fork Model
# Version: 2.3-fork
# Trigger: Upload this file to .github/workflows/scan.yml
#          in a forked repository that already contains
#          scanner-payload/scanner-payload.zip
#
# Two-upload model:
#   Upload 1 → scanner-payload/scanner-payload.zip
#   Upload 2 → .github/workflows/scan.yml  ← you are here
#
# The push that creates this file fires the workflow.
# Subsequent runs: use the Actions tab → Run workflow button.
# ============================================================

name: DoD Security Scanner

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/scan.yml
      - scan-triggers/**

permissions:
  contents: write
  actions: read
  security-events: write

# ============================================================
# JOB 0 — Extract scanner payload from ZIP
# Runs once on first trigger. Idempotent — safe to re-run.
# Commits scripts, configs, and placeholder directories.
# ============================================================
jobs:
  setup-scanner-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      run_number: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify payload ZIP exists
        run: |
          if [ ! -f "scanner-payload/scanner-payload.zip" ]; then
            echo "ERROR: scanner-payload/scanner-payload.zip not found."
            echo "Upload the payload ZIP to scanner-payload/ before uploading this workflow file."
            exit 1
          fi
          echo "Payload ZIP found: $(du -sh scanner-payload/scanner-payload.zip)"

      - name: Extract payload ZIP (zip-slip protected)
        run: |
          python3 - <<'PYTHON'
          import zipfile, os, pathlib

          zip_path  = "scanner-payload/scanner-payload.zip"
          dest      = pathlib.Path("/tmp/payload").resolve()
          dest.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(zip_path) as zf:
              for member in zf.infolist():
                  target = (dest / member.filename).resolve()
                  if not str(target).startswith(str(dest)):
                      raise ValueError(f"Zip-slip attempt blocked: {member.filename}")
                  zf.extract(member, dest)

          print("Extraction complete.")
          PYTHON

      - name: Install infrastructure files
        run: |
          mkdir -p scripts reports

          # Scripts
          if [ -d "/tmp/payload/scripts" ]; then
            cp -v /tmp/payload/scripts/* scripts/
          fi

          # CIA profile (only if not already customised)
          if [ -f "/tmp/payload/cia-profile.yaml" ]; then
            cp -v /tmp/payload/cia-profile.yaml ./
          fi

          # Reports placeholder
          if [ -f "/tmp/payload/reports/.gitkeep" ]; then
            cp -v /tmp/payload/reports/.gitkeep reports/
          else
            touch reports/.gitkeep
          fi

          # Documentation
          [ -f "/tmp/payload/REFERENCES.md" ]         && cp -v /tmp/payload/REFERENCES.md ./
          [ -f "/tmp/payload/COMPLIANCE-OVERVIEW.md" ] && cp -v /tmp/payload/COMPLIANCE-OVERVIEW.md ./

          echo "Infrastructure installation complete."
          ls -la scripts/ reports/ cia-profile.yaml 2>/dev/null || true

      - name: Commit infrastructure to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ reports/ cia-profile.yaml REFERENCES.md \
                  COMPLIANCE-OVERVIEW.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No infrastructure changes to commit — files already current."
          else
            git commit -m "chore: install scanner infrastructure run ${{ github.run_number }} [skip ci]"
            git push
          fi

# ============================================================
# JOB 1 — Inventory source code
# Reads the repository checkout (all source files).
# Produces extracted-code and extraction-debug artifacts.
# ============================================================
  prepare-code:
    runs-on: ubuntu-latest
    needs: setup-scanner-infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inventory source files
        run: |
          mkdir -p /tmp/extracted

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='reports/' \
            --exclude='scripts/' \
            --exclude='scanner-payload/' \
            --exclude='scan-triggers/' \
            --exclude='cia-profile.yaml' \
            --exclude='REFERENCES.md' \
            --exclude='COMPLIANCE-OVERVIEW.md' \
            . /tmp/extracted/

          echo "Source inventory complete."
          find /tmp/extracted -type f | wc -l
          du -sh /tmp/extracted

      - name: Build manifest candidate list
        run: |
          find /tmp/extracted \
            \( -name "package.json"      \
            -o -name "package-lock.json" \
            -o -name "yarn.lock"         \
            -o -name "requirements.txt"  \
            -o -name "Pipfile"           \
            -o -name "Pipfile.lock"      \
            -o -name "pyproject.toml"    \
            -o -name "setup.py"          \
            -o -name "setup.cfg"         \
            -o -name "poetry.lock"       \
            -o -name "pom.xml"           \
            -o -name "build.gradle"      \
            -o -name "build.gradle.kts"  \
            -o -name "go.mod"            \
            -o -name "go.sum"            \
            -o -name "Cargo.toml"        \
            -o -name "Cargo.lock"        \
            -o -name "*.csproj"          \
            -o -name "*.sln"             \
            -o -name "composer.json"     \
            -o -name "Gemfile"           \
            -o -name "Gemfile.lock"      \
            \) 2>/dev/null \
            | tee /tmp/manifest-candidates.txt

          MANIFEST_COUNT=$(wc -l < /tmp/manifest-candidates.txt)
          echo "Found ${MANIFEST_COUNT} manifest file(s)."

      - name: Generate extraction summary
        run: |
          FILE_COUNT=$(find /tmp/extracted -type f | wc -l)
          DIR_COUNT=$(find /tmp/extracted -type d | wc -l)
          TOTAL_SIZE=$(du -sh /tmp/extracted | cut -f1)

          cat > /tmp/extraction-summary.json <<JSON
          {
            "run_number":   ${{ github.run_number }},
            "repository":   "${{ github.repository }}",
            "ref":          "${{ github.ref }}",
            "sha":          "${{ github.sha }}",
            "triggered_by": "${{ github.event_name }}",
            "timestamp":    "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "file_count":   ${FILE_COUNT},
            "dir_count":    ${DIR_COUNT},
            "total_size":   "${TOTAL_SIZE}"
          }
          JSON

          du -sh /tmp/extracted  > /tmp/extracted-size.txt
          tree /tmp/extracted    > /tmp/extracted-tree.txt 2>/dev/null \
            || find /tmp/extracted -type f > /tmp/extracted-tree.txt

          cat /tmp/extraction-summary.json

      - name: Upload extracted-code artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted/
          retention-days: 14

      - name: Upload extraction-debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: extraction-debug
          path: |
            /tmp/extraction-summary.json
            /tmp/extracted-tree.txt
            /tmp/extracted-size.txt
            /tmp/manifest-candidates.txt
          retention-days: 14

# ============================================================
# JOBS 2–5 — Parallel scanners
# All depend on prepare-code. All use continue-on-error.
# Partial output is always uploaded — pipeline never halts.
# ============================================================

  # ----------------------------------------------------------
  # JOB 2 — Syft: SPDX 2.3 Software Bill of Materials
  # Satisfies: SR-3, SR-4, NTIA SBOM minimum elements
  # ----------------------------------------------------------
  syft-sbom:
    runs-on: ubuntu-latest
    needs: prepare-code
    continue-on-error: true

    steps:
      - name: Download extracted-code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted/

      - name: Install Syft
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version | tee /tmp/syft-version.txt

      - name: Generate SPDX 2.3 SBOM
        id: sbom_run
        run: |
          syft /tmp/extracted \
            --output spdx-json=/tmp/sbom-spdx.json \
            --output table \
            2>&1 | tee /tmp/syft.log
          echo "exit_code=$?" >> $GITHUB_ENV
        continue-on-error: true

      - name: Write status files
        run: |
          echo "{\"exit_code\": ${exit_code:-0}, \"status\": \"complete\", \
                 \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > /tmp/syft-status.json
          cp /tmp/syft-status.json /tmp/sbom-status.json
          # Ensure output file exists even if Syft produced nothing
          [ -f /tmp/sbom-spdx.json ] || echo '{"spdxVersion":"SPDX-2.3","packages":[]}' \
            > /tmp/sbom-spdx.json

      - name: Upload sbom-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-results
          path: |
            /tmp/sbom-spdx.json
            /tmp/sbom-status.json
            /tmp/syft-status.json
            /tmp/syft-version.txt
            /tmp/syft.log
          retention-days: 14

  # ----------------------------------------------------------
  # JOB 3 — Snyk: Dependency vulnerability scan + monitor
  # Satisfies: APSC-DV-003235, RA-5
  # Exit code 3 = no manifests found (normal, not an error)
  # ----------------------------------------------------------
  snyk-sca:
    runs-on: ubuntu-latest
    needs: prepare-code
    continue-on-error: true

    steps:
      - name: Download extracted-code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted/

      - name: Install Snyk CLI
        run: |
          npm install -g snyk --quiet
          snyk --version | tee /tmp/snyk-version.txt

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk test (all projects)
        run: |
          cd /tmp/extracted
          snyk test \
            --all-projects \
            --json \
            --json-file-output=/tmp/snyk-results.json \
            ${SNYK_ORG_ID:+--org=$SNYK_ORG_ID} \
            2>&1 | tee /tmp/snyk-test.log
          SNYK_EXIT=$?
          # Exit code 3 = no supported manifests — normal, not an error
          if [ "$SNYK_EXIT" -eq 3 ]; then
            echo "{\"exit_code\": 3, \"status\": \"no_manifests\", \
                   \"note\": \"No supported package manifests found — normal for C/system projects\"}" \
              > /tmp/snyk-test-status.json
          else
            echo "{\"exit_code\": $SNYK_EXIT, \"status\": \"complete\"}" \
              > /tmp/snyk-test-status.json
          fi
        env:
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        continue-on-error: true

      - name: Snyk monitor (publish to dashboard)
        run: |
          cd /tmp/extracted
          snyk monitor \
            --all-projects \
            ${SNYK_ORG_ID:+--org=$SNYK_ORG_ID} \
            2>&1 | tee /tmp/snyk-monitor.log
          echo "{\"exit_code\": $?, \"status\": \"complete\"}" \
            > /tmp/snyk-monitor-status.json
        env:
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        continue-on-error: true

      - name: Snyk unmanaged test (C/C++ binaries)
        run: |
          cd /tmp/extracted
          snyk test \
            --unmanaged \
            --json \
            --json-file-output=/tmp/snyk-unmanaged-results.json \
            ${SNYK_ORG_ID:+--org=$SNYK_ORG_ID} \
            2>&1 | tee /tmp/snyk-unmanaged-test.log
          SNYK_EXIT=$?
          # Exit code 147 = no C/C++ source found — normal
          if [ "$SNYK_EXIT" -eq 147 ]; then
            echo "{\"exit_code\": 147, \"status\": \"no_cc_source\", \
                   \"note\": \"No C/C++ source detected — normal for non-C projects\"}" \
              > /tmp/snyk-unmanaged-status.json
          else
            echo "{\"exit_code\": $SNYK_EXIT, \"status\": \"complete\"}" \
              > /tmp/snyk-unmanaged-status.json
          fi
        env:
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        continue-on-error: true

      - name: Ensure output files exist
        run: |
          [ -f /tmp/snyk-results.json ]           || echo '{}' > /tmp/snyk-results.json
          [ -f /tmp/snyk-unmanaged-results.json ] || echo '{}' > /tmp/snyk-unmanaged-results.json
          [ -f /tmp/snyk-manifest-candidates.txt ] || \
            cp /tmp/manifest-candidates.txt /tmp/snyk-manifest-candidates.txt 2>/dev/null \
            || touch /tmp/snyk-manifest-candidates.txt

      - name: Upload snyk-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: |
            /tmp/snyk-results.json
            /tmp/snyk-unmanaged-results.json
            /tmp/snyk-test.log
            /tmp/snyk-monitor.log
            /tmp/snyk-unmanaged-test.log
            /tmp/snyk-test-status.json
            /tmp/snyk-monitor-status.json
            /tmp/snyk-unmanaged-status.json
            /tmp/snyk-manifest-candidates.txt
            /tmp/snyk-version.txt
          retention-days: 14

  # ----------------------------------------------------------
  # JOB 4 — Grype: Vulnerability matching (EPSS + KEV embedded)
  # Satisfies: APSC-DV-003235, RA-5
  # EPSS and KEV data embedded in Grype DB — no external API
  # ----------------------------------------------------------
  grype-sca:
    runs-on: ubuntu-latest
    needs: prepare-code
    continue-on-error: true

    steps:
      - name: Download extracted-code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted/

      - name: Install Grype
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
          grype version | tee /tmp/grype-version.txt

      - name: Update Grype vulnerability database
        run: grype db update 2>&1 | tee -a /tmp/grype.log
        continue-on-error: true

      - name: Run Grype vulnerability scan
        run: |
          grype dir:/tmp/extracted \
            --output json \
            --file /tmp/grype-results.json \
            --add-cpes-if-none \
            2>&1 | tee -a /tmp/grype.log
          GRYPE_EXIT=$?
          echo "{\"exit_code\": $GRYPE_EXIT, \"status\": \"complete\", \
                 \"db_updated\": true, \
                 \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > /tmp/grype-status.json
        continue-on-error: true

      - name: Ensure output file exists
        run: |
          [ -f /tmp/grype-results.json ] || \
            echo '{"matches":[],"source":{"type":"directory"}}' \
            > /tmp/grype-results.json

      - name: Upload grype-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: |
            /tmp/grype-results.json
            /tmp/grype-status.json
            /tmp/grype-version.txt
            /tmp/grype.log
          retention-days: 14

  # ----------------------------------------------------------
  # JOB 5 — Semgrep: Static Application Security Testing
  # Satisfies: APSC-DV-002560, SA-11
  # Ruleset: p/ci (production-grade, language-agnostic)
  # ----------------------------------------------------------
  semgrep-sast:
    runs-on: ubuntu-latest
    needs: prepare-code
    continue-on-error: true

    steps:
      - name: Download extracted-code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted/

      - name: Install Semgrep
        run: |
          pip install semgrep --quiet
          semgrep --version | tee /tmp/semgrep-version.txt

      - name: Run Semgrep SAST scan
        run: |
          semgrep \
            --config p/ci \
            --json \
            --output /tmp/semgrep-results.json \
            --metrics off \
            /tmp/extracted \
            2>&1 | tee /tmp/semgrep.log
          SEMGREP_EXIT=$?
          echo "{\"exit_code\": $SEMGREP_EXIT, \"status\": \"complete\", \
                 \"ruleset\": \"p/ci\", \
                 \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > /tmp/semgrep-status.json
        continue-on-error: true

      - name: Ensure output file exists
        run: |
          [ -f /tmp/semgrep-results.json ] || \
            echo '{"results":[],"errors":[],"version":"0"}' \
            > /tmp/semgrep-results.json

      - name: Upload semgrep-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            /tmp/semgrep-results.json
            /tmp/semgrep-status.json
            /tmp/semgrep-version.txt
            /tmp/semgrep.log
          retention-days: 14

# ============================================================
# JOB 6 — Consolidate all scan results
# Merges artifacts, generates numbered run report,
# commits everything to reports/, uploads consolidated artifact
# ============================================================
  consolidate-reports:
    runs-on: ubuntu-latest
    needs: [syft-sbom, snyk-sca, grype-sca, semgrep-sast]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Pull latest (infrastructure commit may have just landed)
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts/

      - name: Merge artifacts into reports/
        run: |
          mkdir -p reports
          for dir in sbom-results snyk-results grype-results \
                     semgrep-results extraction-debug; do
            if [ -d "/tmp/artifacts/${dir}" ]; then
              cp -v /tmp/artifacts/${dir}/* reports/ 2>/dev/null || true
            fi
          done
          echo "reports/ contents:"
          ls -la reports/

      - name: Generate numbered scan report
        run: |
          RUN=${{ github.run_number }}
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          SHA_SHORT="${{ github.sha }}"
          SHA_SHORT="${SHA_SHORT:0:8}"

          cat > reports/SCA-Report-Run-${RUN}.md << REPORT
          # Security Scan Report — Run ${RUN}

          | Field | Value |
          |---|---|
          | Repository | ${{ github.repository }} |
          | Commit | ${SHA_SHORT} |
          | Branch | ${{ github.ref_name }} |
          | Triggered by | ${{ github.event_name }} |
          | Scan date | ${TIMESTAMP} |
          | Runner OS | ubuntu-latest |

          ## Tools Executed

          | Tool | Purpose | Output File |
          |---|---|---|
          | Syft | SPDX 2.3 SBOM generation | sbom-spdx.json |
          | Grype | SCA vulnerability matching (EPSS + KEV) | grype-results.json |
          | Snyk | Manifest-based dependency scanning | snyk-results.json |
          | Semgrep | SAST — p/ci ruleset | semgrep-results.json |

          ## Compliance Controls Addressed

          | Control | Tool | Standard |
          |---|---|---|
          | APSC-DV-002560 | Semgrep | DISA ASD STIG v5 |
          | APSC-DV-003235 | Grype + Snyk | DISA ASD STIG v5 |
          | SA-11 | Semgrep | NIST SP 800-53 Rev 5 |
          | SA-15 | Workflow logs + commit history | NIST SP 800-53 Rev 5 |
          | RA-5 | Grype + Snyk | NIST SP 800-53 Rev 5 |
          | SR-3 | Syft SBOM | NIST SP 800-53 Rev 5 |
          | SR-4 | Syft SBOM (PURL/CPE) | NIST SP 800-53 Rev 5 |

          *Generated automatically by DoD Security Scanner v2.3-fork*
          REPORT

          cp reports/SCA-Report-Run-${RUN}.md reports/Security-Scan-Report-Latest.md
          echo "Run report generated: SCA-Report-Run-${RUN}.md"

      - name: Commit reports to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: scan results run ${{ github.run_number }} [skip ci]"
            git push
          fi

      - name: Upload consolidated-security-reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-reports
          path: reports/
          retention-days: 30

# ============================================================
# JOB 7 — Create GitHub Release with full audit archive
# Immutable, dated, retrievable evidence per DoDI 8510.01
# ============================================================
 # ============================================================
# REPLACEMENT: create-release job
# ============================================================
# In scan.yml, find the existing create-release job and replace
# it entirely with this block.
#
# Changes from previous version:
#   - Adds "Build release body" step with inline Python that
#     reads all scan JSON files and builds a rich markdown body
#   - Switches from body: (inline string) to body_path: (file)
#   - Release body now shows real findings data, not static text
# ============================================================
  create-release:
    runs-on: ubuntu-latest
    needs: consolidate-reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Download consolidated reports
        uses: actions/download-artifact@v4
        with:
          name: consolidated-security-reports
          path: release-artifacts/reports/

      - name: Copy documentation into archive
        run: |
          [ -f REFERENCES.md ]           && cp REFERENCES.md           release-artifacts/
          [ -f COMPLIANCE-OVERVIEW.md ]  && cp COMPLIANCE-OVERVIEW.md  release-artifacts/

      # ──────────────────────────────────────────────────────
      # Build the release body from actual scan data.
      # Reads grype-results.json, sbom-spdx.json,
      # semgrep-results.json, and all *-status.json files.
      # Writes /tmp/release-body.md for the release action.
      # ──────────────────────────────────────────────────────
      - name: Build release body
        run: |
          python3 - << 'PYTHON'
          import json, os
          from pathlib import Path

          reports = Path("release-artifacts/reports")

          # ── Helpers ─────────────────────────────────────
          def load_json(name):
              p = reports / name
              if p.exists() and p.stat().st_size > 2:
                  try:
                      return json.loads(p.read_text())
                  except Exception:
                      return {}
              return {}

          def tool_status(d):
              ec = d.get("exit_code", -1)
              if ec ==   0: return "Complete"
              if ec ==   3: return "No package manifests found"
              if ec == 147: return "No C/C++ source detected"
              if ec ==  -1: return "Not run"
              return f"Exit code {ec}"

          def cvss_score(m):
              cvss = m.get("vulnerability", {}).get("cvss", [])
              return cvss[0].get("metrics", {}).get("baseScore", 0) if cvss else 0

          # ── Load data ────────────────────────────────────
          grype      = load_json("grype-results.json")
          sbom       = load_json("sbom-spdx.json")
          semgrep    = load_json("semgrep-results.json")
          snyk_st    = load_json("snyk-test-status.json")
          grype_st   = load_json("grype-status.json")
          syft_st    = load_json("syft-status.json")
          semgrep_st = load_json("semgrep-status.json")
          summary    = load_json("extraction-summary.json")

          # ── Counts ───────────────────────────────────────
          matches   = grype.get("matches", [])
          sev_order = ["Critical", "High", "Medium", "Low", "Negligible"]
          sev_counts = {s: 0 for s in sev_order}
          kev_count  = 0

          for m in matches:
              sev = m.get("vulnerability", {}).get("severity", "Unknown")
              if sev in sev_counts:
                  sev_counts[sev] += 1
              if m.get("vulnerability", {}).get("kev", False):
                  kev_count += 1

          total_vulns = sum(sev_counts.values())
          pkg_count   = len(sbom.get("packages", []))
          sast_results = semgrep.get("results", [])
          sast_count   = len(sast_results)

          # ── Env vars ─────────────────────────────────────
          repo       = os.environ.get("GITHUB_REPOSITORY", "unknown")
          run_num    = os.environ.get("GITHUB_RUN_NUMBER", "?")
          ref_name   = os.environ.get("GITHUB_REF_NAME", "?")
          sha        = os.environ.get("GITHUB_SHA", "?")[:8]
          event      = os.environ.get("GITHUB_EVENT_NAME", "?")
          timestamp  = summary.get("timestamp", "unknown")
          file_count = summary.get("file_count", "?")
          total_size = summary.get("total_size", "?")

          L = []   # lines buffer

          # ════════════════════════════════════════════════
          # SECTION 1 — FINDINGS SUMMARY
          # ════════════════════════════════════════════════
          L += [
              "## Findings Summary",
              "",
              "| Metric | Value |",
              "|---|---|",
          ]
          for sev in sev_order:
              if sev_counts[sev] > 0:
                  L.append(f"| {sev} Vulnerabilities | {sev_counts[sev]} |")
          L += [
              f"| **Total Vulnerabilities** | **{total_vulns}** |",
              f"| In CISA KEV | {kev_count} |",
              f"| SBOM Packages Inventoried | {pkg_count} |",
              f"| SAST Findings | {sast_count} |",
              "",
          ]

          # ════════════════════════════════════════════════
          # SECTION 2 — SCAN IDENTITY
          # ════════════════════════════════════════════════
          L += [
              "---",
              "",
              "## Scan Identity",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| Repository | {repo} |",
              f"| Branch | {ref_name} |",
              f"| Commit | `{sha}` |",
              f"| Scan Date | {timestamp} |",
              f"| Run Number | {run_num} |",
              f"| Triggered By | {event} |",
              f"| Source Files Scanned | {file_count} |",
              f"| Total Source Size | {total_size} |",
              "",
          ]

          # ════════════════════════════════════════════════
          # SECTION 3 — COMPLIANCE CONTROLS
          # ════════════════════════════════════════════════
          semgrep_s = tool_status(semgrep_st)
          grype_s   = tool_status(grype_st)
          syft_s    = tool_status(syft_st)

          satisfied = lambda s: "Satisfied" if s == "Complete" else f"Partial — {s}"

          L += [
              "---",
              "",
              "## Compliance Controls",
              "",
              "| Control | Standard | Tool | Status |",
              "|---|---|---|---|",
              f"| APSC-DV-002560 — SAST Execution | DISA ASD STIG v5 | Semgrep | {satisfied(semgrep_s)} |",
              f"| APSC-DV-003235 — Dependency Scanning | DISA ASD STIG v5 | Grype + Snyk | {satisfied(grype_s)} |",
              f"| SA-11 — Developer Testing | NIST SP 800-53 Rev 5 | Semgrep | {satisfied(semgrep_s)} |",
               "| SA-15 — Development Process | NIST SP 800-53 Rev 5 | Workflow logs + commit history | Satisfied |",
              f"| RA-5 — Vulnerability Monitoring | NIST SP 800-53 Rev 5 | Grype + Snyk | {satisfied(grype_s)} |",
              f"| SR-3 — Supply Chain Protection | NIST SP 800-53 Rev 5 | Syft | {satisfied(syft_s)} |",
              f"| SR-4 — Provenance Tracking | NIST SP 800-53 Rev 5 | Syft (PURL/CPE) | {satisfied(syft_s)} |",
              f"| NTIA SBOM Minimum Elements | SBOM Federal Mandate | Syft | {satisfied(syft_s)} |",
               "| DoDI 8510.01 — Audit Trail | DoD Policy | GitHub Release | Satisfied |",
              "",
          ]

          # ════════════════════════════════════════════════
          # SECTION 4 — VULNERABILITY FINDINGS TABLE
          # ════════════════════════════════════════════════
          L += [
              "---",
              "",
              "## Vulnerability Findings",
              "",
          ]

          if matches:
              sorted_matches = sorted(matches, key=cvss_score, reverse=True)

              L += [
                  "| ID | CVE | Severity | CVSS | Package | Version | Fix Version | KEV |",
                  "|---|---|---|---|---|---|---|---|",
              ]

              for m in sorted_matches:
                  vuln = m.get("vulnerability", {})
                  art  = m.get("artifact", {})
                  fix  = vuln.get("fix", {})
                  cwes = vuln.get("cwes", [])

                  ghsa_id  = vuln.get("id", "?")
                  cve_id   = cwes[0].get("cve", "N/A") if cwes else "N/A"
                  sev      = vuln.get("severity", "?")
                  score    = cvss_score(m) or "N/A"
                  pkg_name = art.get("name", "?")
                  pkg_ver  = art.get("version", "?")
                  fix_ver  = ", ".join(fix.get("versions", [])) if fix.get("versions") else fix.get("state", "Unknown")
                  kev_flag = "**YES**" if vuln.get("kev", False) else "No"

                  L.append(
                      f"| {ghsa_id} | {cve_id} | {sev} | {score} | "
                      f"`{pkg_name}` | {pkg_ver} | {fix_ver} | {kev_flag} |"
                  )

              L.append("")

          else:
              L += ["No vulnerabilities identified.", ""]

          # SAST findings (if any)
          if sast_results:
              L += [
                  "### SAST Findings",
                  "",
                  "| Rule | File | Line | Severity |",
                  "|---|---|---|---|",
              ]
              cap = 25
              for r in sast_results[:cap]:
                  rule = r.get("check_id", "?").split(".")[-1]
                  path = r.get("path", "?")
                  line = r.get("start", {}).get("line", "?")
                  sev  = r.get("extra", {}).get("severity", "?")
                  L.append(f"| {rule} | `{path}` | {line} | {sev} |")
              if len(sast_results) > cap:
                  L.append(f"| *...and {len(sast_results) - cap} more — see developer-report* | | | |")
              L.append("")
          else:
              L += ["### SAST Findings", "", "No SAST findings identified.", ""]

          # ════════════════════════════════════════════════
          # SECTION 5 — TOOL EXECUTION STATUS
          # ════════════════════════════════════════════════
          snyk_note = (
              "No package manifests found — Grype provided SCA coverage"
              if snyk_st.get("exit_code") == 3
              else tool_status(snyk_st)
          )

          L += [
              "---",
              "",
              "## Tool Execution",
              "",
              "| Tool | Purpose | Status |",
              "|---|---|---|",
              f"| Syft | SPDX 2.3 SBOM Generation | {tool_status(syft_st)} |",
              f"| Grype | SCA Vulnerability Matching (CVSS, EPSS, KEV) | {tool_status(grype_st)} |",
              f"| Snyk | Manifest-Based Dependency Scanning | {snyk_note} |",
              f"| Semgrep | Static Application Security Testing (p/ci) | {tool_status(semgrep_st)} |",
               "| CodeQL | Semantic Code Analysis | Results in Security tab |",
              "",
          ]

          # ════════════════════════════════════════════════
          # SECTION 6 — ATTACHED FILES
          # ════════════════════════════════════════════════
          L += [
              "---",
              "",
              "## Attached Files",
              "",
              "### Formatted Reports",
              "",
              "| File | Format | Audience |",
              "|---|---|---|",
              "| `developer-report.docx` | Word | Developer / Security Engineer |",
              "| `developer-report.html` | HTML (self-contained) | Developer / Security Engineer |",
              "| `developer-report.md` | Markdown | Developer / Security Engineer |",
              "| `analyst-report.docx` | Word | Security Analyst / ISSO |",
              "| `analyst-report.html` | HTML (self-contained) | Security Analyst / ISSO |",
              "| `analyst-report.md` | Markdown | Security Analyst / ISSO |",
              "| `leadership-report.docx` | Word | Authorizing Official / PM |",
              "| `leadership-report.html` | HTML (self-contained) | Authorizing Official / PM |",
              "| `leadership-report.md` | Markdown | Authorizing Official / PM |",
              "",
              "### Raw Evidence",
              "",
              "| File | Contents |",
              "|---|---|",
              "| `sbom-spdx.json` | SPDX 2.3 Software Bill of Materials — all packages with PURL and CPE |",
              "| `grype-results.json` | Vulnerability findings — CVSS v3.1, EPSS scores, CISA KEV flags |",
              "| `snyk-results.json` | Snyk manifest-based dependency scan results |",
              "| `semgrep-results.json` | Static analysis findings — Semgrep p/ci ruleset |",
              "| `Security-Scan-Report-Latest.md` | Human-readable summary of this scan run |",
              "| `REFERENCES.md` | Authoritative sources for all metrics and standards |",
              "| `COMPLIANCE-OVERVIEW.md` | Program explanation for auditors and oversight personnel |",
              "",
              "### Archive",
              "",
              "| File | Contents |",
              "|---|---|",
              f"| `security-scan-reports-{run_num}.zip` | Complete audit archive — all reports and raw evidence |",
              "",
              "---",
              "",
              "*DoD Security Scanner v2.3-fork \\| UNCLASSIFIED*",
          ]

          body = "\n".join(L)
          Path("/tmp/release-body.md").write_text(body)
          print(f"Release body written — {len(body)} characters, {len(L)} lines")
          PYTHON
        env:
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
          GITHUB_REF_NAME:    ${{ github.ref_name }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_EVENT_NAME:  ${{ github.event_name }}

      - name: Build release archive ZIP
        run: |
          zip -r security-scan-reports-${{ github.run_number }}.zip \
            release-artifacts/
          echo "Archive size: $(du -sh security-scan-reports-${{ github.run_number }}.zip)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  security-scan-${{ github.run_number }}
          name:      "Security Scan Reports — Run ${{ github.run_number }}"
          body_path: /tmp/release-body.md
          files: |
            security-scan-reports-${{ github.run_number }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

# ============================================================
# JOB 8 — Generate formatted compliance reports
# Produces 9 files: Developer / Analyst / Leadership × DOCX / HTML / MD
# Attaches all 9 to the GitHub Release created in Job 7
# ============================================================
  generate-security-reports:
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Download consolidated reports
        uses: actions/download-artifact@v4
        with:
          name: consolidated-security-reports
          path: reports/

      - name: Install Python report dependencies
        run: |
          pip install -r scripts/requirements-reports.txt --quiet

      - name: Run report generator
        run: |
          mkdir -p /tmp/security-reports
          python scripts/generate_reports.py \
            --reports-dir   reports/ \
            --profile-path  cia-profile.yaml \
            --output-dir    /tmp/security-reports/

      - name: Verify report outputs
        run: |
          echo "Generated files:"
          ls -lh /tmp/security-reports/
          EXPECTED=9
          ACTUAL=$(ls /tmp/security-reports/ | wc -l)
          echo "Expected: ${EXPECTED} files"
          echo "Actual:   ${ACTUAL} files"
          if [ "$ACTUAL" -lt "$EXPECTED" ]; then
            echo "WARNING: Fewer than ${EXPECTED} report files generated."
          fi

      - name: Upload security-reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: /tmp/security-reports/
          retention-days: 90

      - name: Attach reports to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: security-scan-${{ github.run_number }}
          files: |
            /tmp/security-reports/developer-report.docx
            /tmp/security-reports/developer-report.html
            /tmp/security-reports/developer-report.md
            /tmp/security-reports/analyst-report.docx
            /tmp/security-reports/analyst-report.html
            /tmp/security-reports/analyst-report.md
            /tmp/security-reports/leadership-report.docx
            /tmp/security-reports/leadership-report.html
            /tmp/security-reports/leadership-report.md
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
